name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'skills/**'
      - 'docs/**'
      - 'scripts/**'
      - README.md
      - SOURCE.json
      - VERSION
      - requirements-dev.txt
      - '.github/workflows/release.yml'

concurrency:
  group: oms-skills-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DEVELOPMENT_RELEASE: 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          if os.environ['RELEASE_REF_TYPE'] == 'tag' and os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('Tag does not match VERSION')
          PY
      - name: Validate and build
        run: |
          python scripts/validate_skills.py
          python scripts/build_release.py
      - name: Publish release and downloads
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const version = fs.readFileSync('VERSION', 'utf8').trim();
            const tag = `v${version}`;
            const development = process.env.DEVELOPMENT_RELEASE === 'true';
            let notes;
            if (development) {
              notes = '开发阶段初始版本，持续同步仓库 main 的最新 Skills，尚未进入稳定交付阶段。';
            } else {
              const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
              const section = changelog.split(`## ${version} - `)[1];
              notes = section.slice(section.indexOf('\n') + 1).split('\n## ')[0].trim();
            }
            const body = notes + '\n\n下载 ZIP 或 TAR.GZ，并使用 SHA256SUMS 核对完整性。\n许可：仅允许安装与使用，不授予修改与再分发权。';
            const prefix = `wyd-oms-skills-${tag}`;
            const files = [`${prefix}.zip`, `${prefix}.tar.gz`, 'SHA256SUMS'];
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({...context.repo, tag})).data;
              if (!release.draft && !development) {
                core.info('Release is already published; preserving immutable version assets');
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, target_commitish: context.sha, name: `${tag} — WYD OMS Skills`,
                body,
                draft: true, prerelease: false
              })).data;
            }
            await github.rest.repos.updateRelease({
              ...context.repo, release_id: release.id, draft: true,
              name: `${tag} — WYD OMS Skills`, body
            });
            for (const name of files) {
              const data = fs.readFileSync(path.join('dist', name));
              const existing = release.assets.find(asset => asset.name === name);
              if (existing) await github.rest.repos.deleteReleaseAsset({...context.repo, asset_id: existing.id});
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.id, name, data,
                headers: {'content-type': 'application/octet-stream', 'content-length': data.length}
              });
            }
            if (development) {
              const newTag = (await github.rest.git.createTag({
                ...context.repo, tag, message: `WYD OMS Skills ${tag}: development initial release`,
                object: context.sha, type: 'commit'
              })).data;
              try {
                await github.rest.git.getRef({...context.repo, ref: `tags/${tag}`});
                await github.rest.git.updateRef({
                  ...context.repo, ref: `tags/${tag}`, sha: newTag.sha, force: true
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.git.createRef({
                  ...context.repo, ref: `refs/tags/${tag}`, sha: newTag.sha
                });
              }
            }
            await github.rest.repos.updateRelease({
              ...context.repo, release_id: release.id, draft: false, make_latest: 'true'
            });
