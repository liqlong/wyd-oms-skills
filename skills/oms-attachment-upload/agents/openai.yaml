interface:
  display_name: "OMS 附件上传"
  short_description: "上传用户提供的工单附件、ToB附件或面单，获取OMS可使用的文件名称和地址"
  default_prompt: "使用 $oms-attachment-upload 将我提供的附件按业务用途上传到统一文件服务，并返回文件名称和地址。"
dependencies:
  tools:
    - type: "mcp"
      value: "oms"
      description: "OMS 附件上传能力"
      transport: "streamable_http"
policy:
  allow_implicit_invocation: true
